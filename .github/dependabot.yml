version: 2
updates:
  # npm dependencies across the workspace (root + service + extension).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk dev/test + type updates into one PR to cut noise.
      dev-and-types:
        patterns:
          - "@types/*"
          - "vitest"
          - "@vitejs/*"
          - "@testing-library/*"
          - "typescript"
          - "tsx"

  # Keep the GitHub Actions in the CI workflow current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
