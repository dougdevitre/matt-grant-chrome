name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -t matt-grant-chrome-service .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Audit the dependencies that actually ship (the Docker runtime installs
      # --omit=dev), failing on high/critical. Dev-toolchain advisories
      # (vite/vitest/esbuild) aren't in the deployed artifact and are handled by
      # Dependabot's major-version bumps instead of blocking every PR.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
